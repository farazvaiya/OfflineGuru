# Engineering team configuration

[orchestrator]
max_concurrent_agents = 1
sequential_execution = true
max_retries_per_issue = 5
max_investigation_cycles = 3

[constraints]
ram_mb_target = 7168
gpu = false
offline_runtime = true
target_students = 30
primary_languages = ["bn", "en"]
objective = "real-time speech-to-speech translation"

[safety]
require_human_approval_for_integration = true
protect_main_branch = true
allow_destructive_without_approval = false
no_auto_merge = true
no_secret_commits = true

[paths]
db = "state/engineering_team.db"
workflow = "state/workflow.json"
reports = "reports"
checkpoints = "checkpoints"
experiments = "experiments"
benchmarks = "benchmarks"

[[agents]]
name = "chief-orchestrator"
role = "Chief Engineering Orchestrator"
responsibilities = ["workflow", "task assignment", "state tracking", "conflict prevention", "resume", "reporting"]

[[agents]]
name = "problem-discovery"
role = "Problem Discovery Agent"
responsibilities = ["inspect code/logs/tests/benchmarks", "find bugs/perf/accuracy/architecture issues", "reproduce", "evidence", "severity"]

[[agents]]
name = "root-cause-analysis"
role = "Root Cause Analysis Agent"
responsibilities = ["diagnose root cause", "compare expected vs actual", "reproducible diagnosis"]

[[agents]]
name = "solution-track-a"
role = "Original Solution Agent — Track A"
responsibilities = ["original design", "implement in isolated worktree", "tests", "optimize for constraints"]

[[agents]]
name = "opensource-research-track-b"
role = "Open-source Research Agent — Track B"
responsibilities = ["search repos", "evaluate license/maintenance/requirements/offline fit", "inspect source", "integration proposal"]

[[agents]]
name = "integration-engineer"
role = "Integration Engineer"
responsibilities = ["integrate candidates in isolated branches", "resolve deps", "preserve interfaces", "document complexity"]

[[agents]]
name = "benchmark-engineer"
role = "Benchmark Engineer"
responsibilities = ["reproducible benchmarks", "equivalent conditions", "record metrics", "compare to baseline"]

[[agents]]
name = "independent-evaluator"
role = "Independent Evaluator"
responsibilities = ["verify evidence", "fair comparison", "detect regressions/misleading metrics", "neutral report"]

[[agents]]
name = "qa-regression"
role = "QA and Regression Agent"
responsibilities = ["unit/integration/e2e tests", "feature/API compatibility", "regressions", "baseline verification"]
