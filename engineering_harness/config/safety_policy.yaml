# Operating boundaries for the autonomous harness.
# The orchestrator refuses actions listed under `forbidden` and requires an
# explicit approval record for anything listed under `requires_approval`.

allowed_without_approval:
  - read_project_source
  - read_local_documentation
  - run_existing_tests
  - run_project_benchmark_scripts
  - write_engineering_harness_artifacts
  - modify_project_source_inside_repo
  - create_source_snapshots_under_engineering_harness_checkpoints
  - run_local_model_inference

requires_approval:
  - destructive_filesystem_operation
  - delete_user_data_or_databases
  - overwrite_uncommitted_user_changes
  - modify_system_wide_settings
  - install_system_packages_or_drivers
  - upload_private_project_data_externally
  - change_credentials
  - production_deployment
  - publish_release
  - change_external_service
  - git_init_or_rewrite_history

forbidden:
  - read_or_print_secrets
  - network_inference_in_classroom_runtime
  - disable_security_protections
  - bypass_tool_permission_prompts
  - relax_acceptance_criteria_without_evaluator_record
  - delete_or_skip_failing_tests_to_pass_a_gate
  - edit_evaluation_datasets_to_improve_metrics
  - fabricate_benchmark_results

secret_handling:
  # .env and credential stores are never read by harness code.
  excluded_paths: [".env", "*.pem", "*.key", "id_rsa*", ".autopilot/memory.db"]
  note: >
    Model weights are local assets, not secrets. No project data leaves the machine;
    every benchmark writes to engineering_harness/artifacts or /tmp.

data_protection:
  preserve_paths:
    - data/guru.db
    - data/audio
    - data/demo
    - models
  note: >
    Checkpoints snapshot source only (guru/, tests/, scripts/, config/). Runtime
    data, model weights and uploaded session audio are never captured, moved or
    deleted, so a rollback cannot destroy a class recording.

evidence_integrity:
  - Every gate decision must cite a machine-readable artifact under artifacts/ or baselines/.
  - Artifacts are append-only; a re-run writes a new file with a run id.
  - A check that cannot run reports BLOCKED, never PASS.
