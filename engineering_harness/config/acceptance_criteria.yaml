# Phase exit gates. Each criterion is evaluated by engineering_harness/checks.py
# against machine-readable evidence. A criterion that cannot be evaluated is
# BLOCKED; it never passes by default.
#
# Numeric targets that depend on a measurement are expressed relative to a
# baseline artifact under baselines/. The baseline is recorded during
# BASELINE_AUDIT before any optimisation work, exactly once, and is never
# regenerated from an optimised build.

version: 1
tolerances:
  # Accuracy may not regress by more than these absolute amounts.
  wer_absolute_regression: 0.01
  translation_metric_absolute_regression: 0.02
  # Latency must improve by at least this fraction of baseline to count.
  latency_min_improvement: 0.15
  # Repetition spread allowed between repeated runs of the same benchmark.
  repeat_spread_p95_pct: 25

phase1:
  name: RESEARCH_AND_ROOT_CAUSE_DIAGNOSIS
  criteria:
    - id: P1G1
      check: p1_architecture_inspected
      description: Repository, pipeline and dependency map inspected and written down.
      evidence: [reports/PHASE1_REPOSITORY_AUDIT.md, reports/ARCHITECTURE_MAP.md]
    - id: P1G2
      check: p1_baselines_recorded
      description: Existing tests and benchmarks reproduced and stored as baselines.
      evidence: [baselines/pytest_baseline.json, baselines/asr_wer_baseline.json]
    - id: P1G3
      check: p1_findings_evidenced
      description: Every major observed problem carries observation/evidence/hypothesis/experiment/result.
      evidence: [state/findings.json]
    - id: P1G4
      check: p1_root_causes
      description: Each finding has a root cause, or is explicitly marked unresolved with a next experiment.
      evidence: [state/findings.json]
    - id: P1G5
      check: p1_hypotheses_tested
      description: Competing hypotheses were actually tested, not just listed.
      evidence: [state/findings.json, experiments/]
    - id: P1G6
      check: p1_repair_plan
      description: Prioritised P0/P1/P2 repair plan derived from findings.
      evidence: [reports/PHASE1_FINAL_REPORT.md]
    - id: P1G7
      check: p1_qa_signoff
      description: QA agent independently re-ran the key evidence.
      evidence: [state/signoffs.json]
    - id: P1G8
      check: p1_evaluator_approval
      description: Evaluator approved the phase against the criteria above.
      evidence: [state/signoffs.json]

phase2:
  name: DEVELOPMENT_AND_REPAIR
  criteria:
    - id: P2G1
      check: p2_checkpoint_exists
      description: A pre-change source checkpoint exists and restores cleanly.
      evidence: [checkpoints/]
    - id: P2G2
      check: p2_fixes_implemented
      description: Every accepted P0/P1 fix is implemented with a regression test that passed.
      evidence: [state/fixes.json, artifacts/]
    - id: P2G3
      check: p2_full_suite
      description: Full test suite passes on the current tree, with evidence newer than the source.
      evidence: [artifacts/pytest_final.json]
    - id: P2G4
      check: p2_contract_preserved
      description: WebSocket/REST/auth behaviours still covered and passing.
      evidence: [artifacts/pytest_final.json]
    - id: P2G5
      check: p2_no_critical_regression
      description: No known critical regression open.
      evidence: [state/findings.json]
    - id: P2G6
      check: p2_qa_signoff
      description: QA agent reviewed the diff and rejected unsupported claims.
      evidence: [state/signoffs.json]
    - id: P2G7
      check: p2_evaluator_approval
      description: Evaluator approved the phase.
      evidence: [state/signoffs.json]

phase3:
  name: OPTIMIZATION_AND_VALIDATION
  criteria:
    - id: P3G1
      check: p3_asr_quality
      description: ASR WER measured on independent audio and not regressed beyond tolerance.
      evidence: [artifacts/asr_wer_final.json, baselines/asr_wer_baseline.json]
    - id: P3G2
      check: p3_translation_quality
      description: Translation quality measured against a human-verified reference.
      evidence: [artifacts/translation_quality_final.json, baselines/translation_quality_baseline.json]
    - id: P3G3
      check: p3_latency
      description: End-to-end latency measured; improvement threshold met.
      evidence: [artifacts/latency_final.json, baselines/latency_baseline.json]
    - id: P3G4
      check: p3_resources
      description: Peak RSS and mean CPU inside the measured hardware budget.
      evidence: [artifacts/latency_final.json]
    - id: P3G5
      check: p3_load_test
      description: 30 simulated students, zero published-segment drops.
      evidence: [artifacts/loadtest_30_final.json]
    - id: P3G6
      check: p3_no_regression
      description: Full suite still passes after optimisation changes.
      evidence: [artifacts/pytest_final.json]
    - id: P3G7
      check: p3_reproducible
      description: Key benchmarks repeated; spread within tolerance.
      evidence: [artifacts/reproducibility.json]
    - id: P3G8
      check: p3_qa_signoff
      description: QA verified the final numbers.
      evidence: [state/signoffs.json]
    - id: P3G9
      check: p3_evaluator_approval
      description: Evaluator approved the final result.
      evidence: [state/signoffs.json]

# Items that cannot be produced on this machine. They are reported separately and
# never silently treated as passing.
not_testable_locally:
  - id: N1
    item: physical_30_phone_classroom_over_hotspot
    reason: Requires 30 physical devices and an RF environment; loopback clients only simulate sockets.
  - id: N2
    item: thermal_sustained_45min_on_target_laptop
    reason: Target i5-7300U hardware is not this host; long runs here do not reproduce its thermals.
  - id: N3
    item: live_microphone_acoustic_accuracy
    reason: No microphone in this container; capture path is exercised with a shimmed arecord and file replay.
