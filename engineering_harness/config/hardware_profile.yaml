# Hardware envelope the acceptance criteria are judged against.
# Values under `measured` were read from this machine on 2026-11-10, not copied
# from the project brief. Re-run `python engineering_harness/orchestrator.py hw`
# to refresh them.

declared_target:
  cpu: "Intel Core i5-7300U"
  physical_cores: 2
  logical_cores: 4
  ram_gb: 7.1
  gpu: none
  os: "Ubuntu Linux"
  runtime: offline
  concurrent_students: 30

measured:
  captured_at: "2026-11-10"
  cpu_model: "see artifacts/hardware.json"
  logical_cores: 4
  ram_total_mb: 7269
  ram_available_mb_at_audit: 2340
  swap_total_mb: 4095
  swap_used_mb_at_audit: 1736
  note: >
    Only ~2.3 GB was available at audit time because other processes held ~4.9 GB.
    Benchmarks that load ASR + translation + TTS concurrently must be assumed to
    have <2.5 GB of headroom, not 7 GB. This is a materially tighter envelope than
    the "approximately 7.1 GB" in the project brief.

resource_budget:
  # Absolute ceilings for the classroom runtime, derived from the measured
  # envelope rather than from the 7.1 GB nominal figure.
  peak_rss_mb: 1400
  cpu_mean_pct: 85
  swap_growth_mb: 64

parallelism_constraints:
  # CTranslate2 and Whisper both default to "use every core". On 4 logical cores
  # with 3 worker threads, over-subscription shows up as tail latency, not as a
  # higher mean, so thread counts are pinned explicitly in config/default.toml.
  asr_cpu_threads: 3
  translate_intra_threads: 2
  worker_threads: 3
